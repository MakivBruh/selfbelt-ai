<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SafeBelt — Simulasi Keselamatan Kabin</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#e8eee9;background:#09130f;--panel:#13231d;--line:#2a4036;--muted:#a9bfb2;--good:#79db9b;--warn:#ffd075;--bad:#ff897d}
*{box-sizing:border-box}body{margin:0;min-height:100vh}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:3px}header{display:flex;justify-content:space-between;align-items:center;padding:18px clamp(18px,4vw,60px);border-bottom:1px solid var(--line);gap:12px}.brand{font-size:20px;font-weight:800;letter-spacing:.04em}.brand span{color:var(--good)}.topright{display:flex;align-items:center;gap:14px}.badge{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.1em}.lang{border:1px solid var(--line);border-radius:6px;background:var(--panel);color:#fff;padding:9px 12px;min-height:44px}
main{max-width:1440px;margin:auto;padding:clamp(18px,3vw,42px)}.eyebrow{color:var(--good);font-size:12px;font-weight:700;letter-spacing:.15em;text-transform:uppercase}h1{font-size:clamp(30px,4vw,52px);line-height:1.07;margin:9px 0 9px;letter-spacing:-.035em}p{color:var(--muted);line-height:1.5;margin:0}.intro{margin-bottom:28px}.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:18px}.panel{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:24px}.panel h2{font-size:16px;margin:0 0 20px}.status{display:flex;align-items:flex-start;gap:14px;padding:18px;border:1px solid var(--line);border-radius:9px;margin-bottom:22px;background:#162b20}.status[data-tone=warn]{background:#302717;border-color:#806536}.status[data-tone=bad]{background:#321d1d;border-color:#93574d}.dot{width:12px;height:12px;flex:none;border-radius:50%;background:var(--good);margin-top:5px;box-shadow:0 0 15px currentColor}.status[data-tone=warn] .dot{background:var(--warn)}.status[data-tone=bad] .dot{background:var(--bad)}.status strong{display:block;font-size:20px;margin-bottom:4px}.status p{font-size:14px}.cabin{border:2px solid #456356;border-radius:70px 70px 30px 30px;padding:35px 20px 22px;max-width:500px;margin:0 auto;position:relative;background:#0e1b15}.cabin:before{content:"FRONT / DEPAN";display:block;text-align:center;color:#718e7c;font:11px Arial;letter-spacing:.18em;margin-bottom:21px}.seats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.seat{border:1px solid #43594d;border-radius:18px 18px 10px 10px;background:#1b3026;min-height:118px;padding:15px;display:flex;flex-direction:column;justify-content:space-between}.seat .symbol{font-size:23px;font-weight:bold}.seat .label{font-size:13px;color:#c9d9cd}.seat .state{font-size:12px;color:var(--good);font-weight:700}.seat[data-state=bad]{border-color:#e3786b;background:#37241f}.seat[data-state=bad] .state{color:var(--bad)}.seat[data-state=empty]{opacity:.58}.seat[data-state=empty] .state{color:var(--muted)}.divider{grid-column:1/-1;border-top:1px dashed #4c6555;margin:3px 0}.footnote{margin-top:20px;font-size:12px}.controls{display:grid;gap:18px}.speed-row{display:flex;justify-content:space-between;align-items:baseline}.speed-row output{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}.speed-row small{font-size:13px;color:var(--muted)}input[type=range]{width:100%;accent-color:var(--good);margin:14px 0 4px;min-height:30px}.speed-scale{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.seat-controls{display:grid;gap:10px}.seat-control{padding:12px 0;border-top:1px solid var(--line)}.seat-control:first-child{border-top:0}.seat-control>strong{display:block;margin-bottom:9px;font-size:14px}.switches{display:flex;gap:8px;flex-wrap:wrap}.toggle{border:1px solid #526b59;background:#1b3427;color:#eaf4ea;padding:9px 12px;border-radius:7px;min-height:44px;font-size:13px}.toggle[aria-pressed=false]{background:transparent;color:var(--muted)}.toggle:disabled{opacity:.4;cursor:not-allowed}.helper{font-size:12px}.log{margin-top:18px}.log h2{margin-bottom:12px}.log ul{list-style:none;padding:0;margin:0;display:grid;gap:9px}.log li{border-top:1px solid var(--line);padding-top:9px;color:#d2e0d4;font-size:13px}.log time{color:var(--muted);margin-right:10px;font-variant-numeric:tabular-nums}.disclaimer{margin-top:18px;color:var(--muted);font-size:12px;line-height:1.5}
@media(max-width:800px){.layout{grid-template-columns:1fr}.panel{padding:18px}.badge{display:none}}@media(max-width:400px){.seat{min-height:100px;padding:10px}.seat .label{font-size:12px}}
</style>
</head>
<body>
<header><div class="brand">SAFE<span>BELT</span> <span style="color:#829d8c;font-size:11px;font-weight:400">/ DEMO</span></div><div class="topright"><span class="badge" id="header-tag"></span><button class="lang" id="lang" type="button" aria-label="Switch language">EN</button></div></header>
<main>
<div class="intro"><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p id="subtitle"></p></div>
<div class="layout">
<section class="panel" aria-labelledby="monitor-heading"><h2 id="monitor-heading"></h2><div class="status" id="status" role="status" aria-live="polite"><span class="dot" aria-hidden="true"></span><div><strong id="status-title"></strong><p id="status-detail"></p></div></div><div class="cabin"><div class="seats" id="seats"></div></div><p class="footnote" id="footnote"></p></section>
<div><section class="panel" aria-labelledby="control-heading"><h2 id="control-heading"></h2><div class="controls"><div><div class="speed-row"><label for="speed" id="speed-label"></label><output id="speed-output" for="speed">0 <small>km/h</small></output></div><input id="speed" type="range" min="0" max="120" step="5" value="0"><div class="speed-scale"><span>0 km/h</span><span>120 km/h</span></div></div><div class="seat-controls" id="seat-controls"></div><p class="helper" id="helper"></p></div></section><section class="panel log" aria-labelledby="log-heading"><h2 id="log-heading"></h2><ul id="log-list" aria-live="polite"></ul></section></div>
</div><p class="disclaimer" id="disclaimer"></p></main>
<script>
'use strict';
const copy={id:{tag:'SIMULASI INTERAKTIF',eyebrow:'PROTOTIPE · KESELAMATAN KENDARAAN',title:'Pantau sabuk. Lindungi perjalanan.',subtitle:'Ubah kondisi kursi dan kecepatan untuk mencoba respons dashboard.',monitor:'STATUS KABIN',control:'KONTROL SIMULASI',speed:'Kecepatan simulasi',seats:['Pengemudi','Penumpang depan','Belakang kiri','Belakang kanan'],occupied:'Terisi',empty:'Kosong',belt:'Sabuk terpasang',unbelt:'Sabuk lepas',safe:'Semua kursi terisi aman',safeDetail:'Seluruh penumpang terdeteksi memakai sabuk pengaman.',warning:'Sabuk belum terpasang',warningDetail:'Pasang sabuk sebelum mulai berkendara.',danger:'Peringatan keselamatan',dangerDetail:'Sabuk lepas saat kendaraan bergerak. Pengemudi diminta memperlambat dan berhenti di tempat aman.',footnote:'Tampilan kursi berdasarkan masukan simulasi, bukan deteksi kamera atau AI aktif.',helper:'Ubah kursi dan geser kecepatan. Kursi kosong tidak memicu peringatan.',log:'RIWAYAT SIMULASI',start:'Simulasi dimulai',change:'Status berubah',disclaimer:'DEMO KONSEP — Tidak terhubung ke kamera, sensor, rem, atau mesin kendaraan. Kendali tetap pada pengemudi.'},en:{tag:'INTERACTIVE SIMULATION',eyebrow:'PROTOTYPE · VEHICLE SAFETY',title:'Check belts. Protect every trip.',subtitle:'Change seat conditions and speed to test dashboard responses.',monitor:'CABIN STATUS',control:'SIMULATION CONTROLS',speed:'Simulated speed',seats:['Driver','Front passenger','Rear left','Rear right'],occupied:'Occupied',empty:'Empty',belt:'Belt fastened',unbelt:'Belt unfastened',safe:'All occupied seats safe',safeDetail:'All detected occupants are wearing seatbelts.',warning:'Seatbelt unfastened',warningDetail:'Fasten seatbelts before driving.',danger:'Safety warning',dangerDetail:'A belt is unfastened while moving. Driver should slow down and stop in a safe place.',footnote:'Seat display uses simulated input, not live camera or AI detection.',helper:'Change seats and move speed slider. Empty seats do not trigger alerts.',log:'SIMULATION HISTORY',start:'Simulation started',change:'Status changed',disclaimer:'CONCEPT DEMO — Not connected to a camera, sensors, brakes, or vehicle engine. Driver remains in control.'}};
const state={lang:'id',speed:0,seats:[{occupied:true,belt:true},{occupied:true,belt:true},{occupied:false,belt:false},{occupied:false,belt:false}],events:[]};
const $=id=>document.getElementById(id);
function condition(){const unsafe=state.seats.some(s=>s.occupied&&!s.belt);return unsafe?(state.speed>0?'bad':'warn'):'good'}
function update(){const t=copy[state.lang],tone=condition();document.documentElement.lang=state.lang;document.title=`SafeBelt — ${t.tag}`;$('header-tag').textContent=t.tag;$('lang').textContent=state.lang==='id'?'EN':'ID';for(const [id,value] of Object.entries({'eyebrow':t.eyebrow,'title':t.title,'subtitle':t.subtitle,'monitor-heading':t.monitor,'control-heading':t.control,'speed-label':t.speed,'footnote':t.footnote,'helper':t.helper,'log-heading':t.log,'disclaimer':t.disclaimer}))$(id).textContent=value;
$('speed-output').innerHTML=`${state.speed} <small>km/h</small>`;$('speed').value=state.speed;$('status').dataset.tone=tone;$('status-title').textContent=tone==='good'?t.safe:tone==='warn'?t.warning:t.danger;$('status-detail').textContent=tone==='good'?t.safeDetail:tone==='warn'?t.warningDetail:t.dangerDetail;
$('seats').replaceChildren(...state.seats.map((s,i)=>{const el=document.createElement('div');el.className='seat';el.dataset.state=!s.occupied?'empty':s.belt?'good':'bad';const symbol=document.createElement('span'),label=document.createElement('span'),status=document.createElement('span');symbol.className='symbol';symbol.textContent=s.occupied?'●':'○';label.className='label';label.textContent=t.seats[i];status.className='state';status.textContent=!s.occupied?t.empty:s.belt?t.belt:t.unbelt;el.append(symbol,label,status);return el}));
$('seat-controls').replaceChildren(...state.seats.map((s,i)=>{const row=document.createElement('div');row.className='seat-control';const name=document.createElement('strong');name.textContent=t.seats[i];const switches=document.createElement('div');switches.className='switches';for(const [key,text,pressed,disabled] of [['occupied',s.occupied?t.occupied:t.empty,s.occupied,i===0],['belt',s.belt?t.belt:t.unbelt,s.belt,!s.occupied]]){const b=document.createElement('button');b.type='button';b.className='toggle';b.textContent=text;b.setAttribute('aria-label',`${t.seats[i]}: ${text}`);b.setAttribute('aria-pressed',String(pressed));b.disabled=disabled;b.addEventListener('click',()=>{s[key]=!s[key];if(key==='occupied'&&!s.occupied)s.belt=false;record();update()});switches.append(b)}row.append(name,switches);return row}));
$('log-list').replaceChildren(...state.events.map(e=>{const li=document.createElement('li'),time=document.createElement('time');time.textContent=e.time;li.append(time,document.createTextNode(`${e.kind==='start'?t.start:t.change}: ${e.kind==='start'?t.safe:e.tone==='good'?t.safe:e.tone==='warn'?t.warning:t.danger} · ${e.speed} km/h`));return li}));}
function record(kind='change'){state.events.unshift({kind,tone:condition(),speed:state.speed,time:new Date().toLocaleTimeString(state.lang==='id'?'id-ID':'en-GB',{hour12:false})});state.events.length=Math.min(state.events.length,5)}
$('speed').addEventListener('input',e=>{state.speed=Number(e.target.value);update()});$('speed').addEventListener('change',()=>{record();update()});$('lang').addEventListener('click',()=>{state.lang=state.lang==='id'?'en':'id';update()});record('start');update();
</script>
</body>
</html>
